version: '3.8'

services:
  # ==========================================
  # PostgreSQL 15 Database Service
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: aegis_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aegis_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aegis_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis 7 In-Memory Queue Store
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Aegis NestJS Backend API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_api
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aegis_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      SMS_PROVIDER: fake
      SMS_SENDER_ID: AEGIS
      FAKE_SMS_FAIL_RATE: 0.0
      FAKE_SMS_LATENCY_MS: 50
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
